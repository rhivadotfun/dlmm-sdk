[workspace]
members = ["commons", "libs/*"]
resolver = "2"

[workspace.dependencies]
anchor-spl = "1.1.2"
anchor-lang = "1.1.2"
anchor-client = "1.1.2"

solana-client = "^3.0.0"
solana-clock = "^3.0.0"
solana-instruction = "^3.0.0"
solana-account = "^3.0.0"
solana-pubkey = "^3.0.0"
spl-associated-token-account = "8.0.0"
solana-transaction-status =  { version="^3.0.0" }
solana-account-decoder = { version="^3.0.0" }
spl-memo = "^6.0.0"
spl-transfer-hook-interface = "2.1.0"
solana-program = { version = "^3.0.0", features = ["borsh"] }

serde_json = "1.0.140"
serde = "1.0.228"
bincode = "1.3.3"
bs58 = "0.5.0"
bytemuck = "1.13.1"

clap = "4.3.3"
shellexpand = "3.1.0"

env_logger = "0.9.0"
log = "0.4.17"

rust_decimal = "1.31.0"
ruint = "1.3.0"
num-integer = "0.1.45"
num-traits = "0.2.16"

hyper = "0.14.17"
routerify = "3"

tokio = "^1.0"
futures-util = "0.3.0"
async-trait = "0.1.0"

anyhow = "1.0.71"

rand = "0.8.5"

chrono = "0.4.45"

ureq = "2.0.0"

itertools = "0.10.0"

commons = { path = "./commons" }
dlmm = { path = "./libs/dlmm" }
solana-keypair = "3.1.2"
solana-commitment-config = "^3.0.0"
solana-compute-budget-interface = "^3.0.0"
solana-transaction = "^3.0.0"
solana-signer = "^3.0.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
